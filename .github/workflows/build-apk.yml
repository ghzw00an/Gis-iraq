name: Build APK 

on:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 

      - uses: actions/setup-node@v4
        with:
          node-version: 20 

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 

      - name: Prepare web files
        run: |
          mkdir -p www
          # إنشاء ملف افتراضي في حال لم يكن index.html موجوداً في المستودع لمنع توقف البناء
          touch index.html 
          cp index.html www/ 

      - name: Create Android project (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "GIS Iraq" com.gisiraq.app --web-dir=www
          npx cap add android
          npx cap sync android 

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gis-iraq-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
